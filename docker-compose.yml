services:
  web:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=mysql+pymysql://${DB_USER:-pbqms_user}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db/pbqms
      - TRUSTED_PROXY_COUNT=1
    ports:
      - "127.0.0.1:5000:5000"   # expose via the nginx reverse proxy only
    volumes:
      # Named volume: writable by the non-root container user, unlike a
      # root-owned host bind mount.
      - qrcodes:/app/static/qrcodes
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask db upgrade && flask seed-db &&
             exec gunicorn --config gunicorn.conf.py wsgi:app"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: pbqms
      MYSQL_USER: ${DB_USER:-pbqms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Replaces the Celery worker: retries failed SMS every 5 minutes and closes
  # the previous day's queues shortly after midnight (Asia/Colombo).
  scheduler:
    build: .
    env_file: .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=mysql+pymysql://${DB_USER:-pbqms_user}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db/pbqms
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.scheduler"]

volumes:
  db_data:
  qrcodes:
