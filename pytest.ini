[pytest]
# Only collect the real test suite. Ad-hoc scripts at the repo root must never
# be imported during collection (they query a dev database at import time).
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # Third-party: openpyxl still calls datetime.utcnow() internally.
    ignore:datetime.datetime.utcnow:DeprecationWarning:openpyxl.*
markers =
    real_sms_dispatch: run the real SmsService._dispatch (the test must mock HTTP itself)
