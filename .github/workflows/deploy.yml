name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbqms-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy to EC2
        shell: bash
        run: |
          set -Eeuo pipefail

          app_dir=/home/ubuntu/pbqms
          if [[ ! -d "$app_dir" ]]; then
            echo "Application directory $app_dir is missing; provision the EC2 host first." >&2
            exit 1
          fi
          if [[ ! -f "$app_dir/.env" ]]; then
            echo "Production .env is missing from $app_dir; configure it before deploying." >&2
            exit 1
          fi
          if [[ ! -x "$app_dir/venv/bin/python" ]]; then
            echo "Application virtualenv is missing; provision the EC2 host first." >&2
            exit 1
          fi
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync is required on the EC2 runner." >&2
            exit 1
          fi

          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='/mestal.pem' \
            --exclude='/venv/' \
            --exclude='/static/qrcodes/' \
            --exclude='/*.sqlite3' \
            --exclude='/.pytest_cache/' \
            --exclude='__pycache__/' \
            "$GITHUB_WORKSPACE/" "$app_dir/"

          cd "$app_dir"
          venv/bin/pip install -r requirements.txt
          FLASK_APP=wsgi.py FLASK_ENV=production venv/bin/flask db upgrade
          sudo -n /usr/bin/systemctl restart pbqms
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2 --max-time 5 \
            http://127.0.0.1:8000/ >/dev/null
