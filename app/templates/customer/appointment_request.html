<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request an appointment — Melsta Hospitals</title>
  <link href="{{ url_for('static', filename='css/pbqms.css') }}" rel="stylesheet">
</head>
<body style="background:#f4f4f5;padding:24px 16px;">
<main class="pb-card" style="max-width:480px;margin:32px auto;">
  <div class="pb-card-header">
    <div class="pb-card-title">Request an appointment</div>
  </div>
  <div class="pb-card-body">
    <p>{{ branch.name }}{% if branch.city %} · {{ branch.city }}{% endif %}</p>
    <form id="appointment-form">
      <input type="hidden" name="branch_id" value="{{ branch.id }}">
      <div class="pb-form-group">
        <label class="pb-form-label" for="full-name">Full name *</label>
        <input id="full-name" name="full_name" class="pb-form-control" autocomplete="name" required>
      </div>
      <div class="pb-form-group">
        <label class="pb-form-label" for="mobile">Mobile number *</label>
        <input id="mobile" name="mobile" class="pb-form-control" type="tel" autocomplete="tel" required>
      </div>
      <div class="pb-form-group">
        <label class="pb-form-label" for="service-type">Department or service *</label>
        <select id="service-type" name="service_type_id" class="pb-form-control" required>
          <option value="">Select a department or service</option>
          {% for service in services %}
          <option value="{{ service.id }}">{{ service.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn-pb-primary w-100" id="submit-btn">Send appointment request</button>
      <div id="request-message" role="status" style="margin-top:12px;"></div>
    </form>
  </div>
</main>
<script>
  document.getElementById('appointment-form').addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('submit-btn');
    const message = document.getElementById('request-message');
    button.disabled = true;
    message.textContent = 'Sending request…';
    const data = Object.fromEntries(new FormData(event.currentTarget).entries());
    data.branch_id = Number(data.branch_id);
    data.service_type_id = Number(data.service_type_id);
    try {
      const response = await fetch('/api/queue/appointments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await response.json();
      if (!response.ok) {
        message.textContent = result.error || 'Could not send request.';
        button.disabled = false;
        return;
      }
      event.currentTarget.reset();
      message.textContent = `Your ${result.service} appointment request was sent. The hospital will contact you.`;
    } catch {
      message.textContent = 'Network error — please try again.';
      button.disabled = false;
    }
  });
</script>
</body>
</html>
