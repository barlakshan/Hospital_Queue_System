# Docker deployment (docker-compose.yml). The EC2 deployment generates an
# equivalent file from deploy/ec2-setup.sh; keep the two in step.
#
# Replace queue.example.com and the certificate paths with your own.
#
# Rate limits (http{} context, e.g. conf.d):
#   pbqms_login  — staff sign-in attempts per client IP
#   pbqms_public — public registration / appointment requests per client IP
#                  (each registration sends an SMS)
limit_req_zone $binary_remote_addr zone=pbqms_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pbqms_public:10m rate=10r/m;

server {
    listen 80;
    server_name queue.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name queue.example.com;
    ssl_certificate     /etc/ssl/certs/pbqms.crt;
    ssl_certificate_key /etc/ssl/private/pbqms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;

    # The app trusts exactly one proxy (TRUSTED_PROXY_COUNT=1): this one.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /socket.io/ {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias /static/; expires 30d; }
    location = /api/auth/login {
        limit_req zone=pbqms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:5000;
    }
    location ~ ^/api/queue/(register|appointments)$ {
        limit_req zone=pbqms_public burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://web:5000;
    }
    location / {
        proxy_pass http://web:5000;
    }
}
